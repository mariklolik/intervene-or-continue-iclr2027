[project]
name = "intervene-or-continue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.6.0",
  "matplotlib==3.10.6",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests", "extension", "controller"]
python_files = ["test_*.py"]
